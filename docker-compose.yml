services:
  postgres:
    image: postgres:16-alpine
    container_name: kittransit-pg
    environment:
      POSTGRES_USER: kittransit
      POSTGRES_PASSWORD: kittransit-local-dev
      POSTGRES_DB: kittransit
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kittransit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kittransit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kittransit-pgdata:
